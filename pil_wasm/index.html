<!DOCTYPE html>
<!-- minlib on wasm64: lib/gui.l's framebuffer GUI on a canvas.
     Follows sdl2gui.c's event contract; see src/browser/host_browser.c. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>PicoLisp minlib &mdash; framebuffer GUI on wasm64</title>
<style>
  body { font: 13px/1.5 system-ui, sans-serif; margin: 0; padding: 1.5rem;
         background: #14161a; color: #c9ccd1; }
  h1 { font-size: 1rem; font-weight: 600; margin: 0 0 .25rem; color: #e6e8eb; }
  p.sub { margin: 0 0 1rem; color: #8b9099; }
  #wrap { display: flex; gap: 1.5rem; align-items: flex-start; flex-wrap: wrap; }
  canvas { background: #000; border: 1px solid #2c3038; border-radius: 4px;
           display: block; cursor: default; touch-action: none; }
  canvas:focus { outline: 2px solid #4c7fd4; outline-offset: 2px; }
  #side { width: 26rem; max-width: 100%; }
  #log { height: 15rem; overflow: auto; margin: 0; padding: .6rem .7rem;
         background: #0e1013; border: 1px solid #2c3038; border-radius: 4px;
         font: 12px/1.45 ui-monospace, monospace; white-space: pre-wrap;
         color: #a9b0ba; }
  form { display: flex; gap: .4rem; margin: .6rem 0; }
  input[type=text] { flex: 1; min-width: 0; padding: .4rem .5rem; color: #e6e8eb;
         background: #0e1013; border: 1px solid #2c3038; border-radius: 4px;
         font: 12px ui-monospace, monospace; }
  button { padding: .4rem .7rem; background: #232830; color: #e6e8eb;
         border: 1px solid #363c46; border-radius: 4px; cursor: pointer;
         font: inherit; }
  button:hover { background: #2c323c; }
  .demos { display: flex; gap: .4rem; flex-wrap: wrap; }
  code { color: #cbd3de; }
</style>
</head>
<body>
<h1>PicoLisp minlib &mdash; framebuffer GUI on wasm64</h1>
<p class="sub">The GUI in <code>lib/gui.l</code>, drawn by PicoLisp into a pixel
buffer and blitted straight to this canvas. No DOM bindings.</p>

<div id="wrap">
  <canvas id="fb" width="800" height="600" tabindex="0"
          aria-label="PicoLisp framebuffer"></canvas>
  <div id="side">
    <div class="demos">
      <button data-demo='(fonts "FreeSansB") (form 2 3 6 5 (1 1 (okButton)))'>OK button</button>
      <button data-demo='(load "test1.l")'>test1.l</button>
      <button data-demo='(load "test2.l")'>test2.l</button>
    </div>
    <form id="repl">
      <input type="text" id="expr" placeholder="(+ 1 2)" spellcheck="false"
             autocomplete="off" aria-label="Lisp expression">
      <button type="submit">Eval</button>
    </form>
    <pre id="log" aria-live="polite" aria-label="Console"></pre>
  </div>
</div>

<script src="picolisp.js"></script>
<script>
const W = 800, H = 600;
const canvas = document.getElementById('fb');
const ctx = canvas.getContext('2d');
const logEl = document.getElementById('log');

function log(s) {
   logEl.textContent += s + '\n';
   logEl.scrollTop = logEl.scrollHeight;
}

// PicoLisp transient symbols use " as the delimiter, \ to escape, and ^ to
// introduce a control character, so all three have to be escaped.
function lispStr(s) {
   return '"' + s.replace(/[\\"^]/g, c => '\\' + c) + '"';
}

createPil({
   print: log,
   printErr: log,
}).then(Module => {
   // Every call that can reach a fiber swap is void: the swap unwinds to the
   // JS boundary and is rewound by Emscripten's trampoline, and a return value
   // does not survive that. Results come back through the getters.
   const pilStart  = Module.cwrap('pilStart', null, ['number', 'number']);
   const pilEvalRaw = Module.cwrap('pilEval', null, ['string']);
   const pilFrame  = Module.cwrap('pilFrame', null, []);
   const pilReady  = Module.cwrap('pilReady', 'number', []);
   const pilPixels = Module.cwrap('pilPixels', 'number', []);
   const pilResult = Module.cwrap('pilResult', 'string', []);

   pilStart(W, H);
   if (!pilReady()) {
      log('Can\'t start PicoLisp');
      return;
   }

   // Re-read the pointer and rebuild the view every frame: ALLOW_MEMORY_GROWTH
   // can detach the old ArrayBuffer.
   function blit() {
      const base = Number(pilPixels());
      const view = new Uint8ClampedArray(Module.HEAPU8.buffer, base, W * H * 4);
      ctx.putImageData(new ImageData(view, W, H), 0, 0);
   }

   // Repaint the background and let lib/gui.l draw over it. Used for events
   // and for opening a form, where stale pixels have to go.
   function draw() {
      pilFrame();
      blit();
      return alive();
   }

   // Redraw the GUI *without* repainting the background, so anything drawn
   // straight into the framebuffer -- (rect), (dot), (render) from the
   // expression box -- survives. (clear 0 0 800 600) wipes it again.
   function redraw() {
      pilEval('(fbDraw)');
      blit();
      return alive();
   }

   // An uncaught Lisp error ends in bye(), which tears the interpreter down;
   // exit() cannot terminate a wasm module, so it is left unusable. Everything
   // this page evaluates is wrapped in a catch so that should not happen, but
   // if it does, say so instead of crashing on the next call.
   function alive() {
      if (pilReady())
         return true;
      log('-- PicoLisp has exited; reload the page --');
      return false;
   }

   function pilEval(expr) {
      pilEvalRaw(expr);
      return pilResult();
   }

   // '(NIL) is the catch-all tag: (car Tag) being NIL makes err() hand back
   // the message. Note ' reads as a dotted pair, so '(NIL) is not (quote (NIL)).
   function guarded(expr) {
      return "(catch '(NIL) " + expr + ")";
   }

   // Evaluate, report, redraw. Used by the demo buttons and the input box.
   function run(expr, echo, keepPixels) {
      if (echo) log('> ' + expr);
      const r = pilEval(guarded(expr));
      log('-> ' + r);
      if (keepPixels) redraw(); else draw();
      return r;
   }

   draw();
   canvas.focus();

   // --- demos and the expression box ---

   for (const b of document.querySelectorAll('[data-demo]'))
      b.addEventListener('click', () => {
         // (co 'gui ...) resumes an already-running coroutine rather than
         // starting the new body, so stop the old form first.
         pilEval(guarded("(co 'gui)"));
         run("(co 'gui " + b.dataset.demo + ")", true);
         canvas.focus();
      });

   document.getElementById('repl').addEventListener('submit', e => {
      e.preventDefault();
      const input = document.getElementById('expr');
      if (input.value.trim()) {
         // keepPixels: direct drawing from here is meant to stay on screen.
         run(input.value, true, true);
         input.value = '';
      }
   });

   // --- mouse, following sdl2gui.c's state machine ---

   let down = false, moved = false, X = 0, Y = 0;

   function at(e) {
      const r = canvas.getBoundingClientRect();
      return [Math.round((e.clientX - r.left) * W / r.width),
              Math.round((e.clientY - r.top) * H / r.height)];
   }

   canvas.addEventListener('pointerdown', e => {
      canvas.focus();
      // Capture keeps the drag alive if the pointer leaves the canvas, but it
      // throws for a pointerId that is not currently active -- which is the
      // case for synthetic events -- so it must not be load-bearing.
      try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
      [X, Y] = at(e);
      down = true, moved = false;
      pilEval(guarded('(fbDn ' + X + ' ' + Y + ')'));
      draw();
   });

   canvas.addEventListener('pointermove', e => {
      if (!down) return;
      const [x, y] = at(e);
      if (moved || x < X - 1 || x > X + 1 || y < Y - 1 || y > Y + 1) {
         moved = true;
         pilEval(guarded('(fbMove ' + x + ' ' + y + ')'));
         draw();
      }
   });

   canvas.addEventListener('pointerup', e => {
      if (!down) return;
      if (!moved)
         pilEval(guarded('(fbClick ' + X + ' ' + Y + ')'));
      pilEval(guarded('(fbUp ' + X + ' ' + Y + ')'));   // the down position, as sdl2gui.c does
      down = moved = false;
      draw();
   });

   // --- keyboard, mapping to the escape sequences lib/gui.l expects ---

   const KEYS = {
      Backspace: '\b', Tab: '\t', Enter: '\r', Escape: '\x1b',
      ArrowLeft: '\x1b[D', ArrowRight: '\x1b[C',
   };

   canvas.addEventListener('keydown', e => {
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      let s = KEYS[e.key];
      if (!s && e.key.length === 1) s = e.key;
      if (!s) return;
      e.preventDefault();
      pilEval(guarded('(fbKey ' + lispStr(s) + ')'));
      draw();
   });
});
</script>
</body>
</html>
